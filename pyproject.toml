[project]
name = "support-agent"
version = "0.1.0"
description = "LLMOps & Agentic Systems: a customer support agent for a fictional B2B SaaS (LangGraph + MCP + LoRA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp[cli]>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Real embeddings and FAISS for the semantic cache (without them: hashing embedder + numpy search).
embeddings = ["sentence-transformers>=3.0", "faiss-cpu>=1.15.1"]
# Loading the Tobi-Bueck dataset from the Hugging Face Hub.
data = ["datasets>=3.0"]
# Monitoring dashboard.
dashboard = ["streamlit>=1.40", "altair>=5.0"]
# LoRA fine-tuning (run on a GPU: Colab, Kaggle, or a local CUDA machine).
finetune = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "datasets>=3.0",
]
dev = ["pytest>=8.0", "langgraph-cli[inmem]>=0.4.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
